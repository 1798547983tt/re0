<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Re:0 · 正文美化 V2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=LXGW+WenKai&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&display=swap');

.re0v2-preview-page {
  min-width: 320px;
  margin: 0;
  padding: 12px 8px 24px;
  color: #ece8e1;
  background: transparent !important;
  font-family: "Noto Sans SC", sans-serif;
}

.re0v2-preview-tools {
  box-sizing: border-box;
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: minmax(240px, 1fr) minmax(170px, 260px) minmax(170px, 260px);
  gap: 14px;
  align-items: end;
  width: min(980px, 100%);
  margin: 0 auto 14px;
  padding: 14px 16px;
  border: 1px solid rgba(255, 255, 255, .13);
  border-radius: 12px;
  background: rgba(12, 10, 15, .82);
  box-shadow: 0 18px 55px rgba(0, 0, 0, .32);
  backdrop-filter: blur(14px);
}

.re0v2-preview-tools strong,
.re0v2-preview-tools span { display: block; }
.re0v2-preview-tools strong { margin-bottom: 3px; color: #f1cf91; letter-spacing: .08em; }
.re0v2-preview-tools span { color: #a9a1ad; font-size: 11px; line-height: 1.55; }
.re0v2-preview-tools label { display: grid; gap: 5px; }
.re0v2-preview-tools select {
  min-width: 0;
  min-height: 42px;
  border: 1px solid rgba(241, 207, 145, .34);
  border-radius: 8px;
  padding: 7px 10px;
  color: #f4eee6;
  background: #19151e;
}

[data-re0v2-mount] {
  --re0v2-reading-font: "Noto Serif SC", "Songti SC", serif;
  --re0v2-reading-size: 17px;
  --re0v2-ink: #172632;
  --re0v2-muted: #62727d;
  --re0v2-surface: #f7fbfc;
  --re0v2-surface-2: #e9f1f4;
  --re0v2-border: #aec5cf;
  --re0v2-accent: #4f96bf;
  --re0v2-accent-2: #d45c72;
  --re0v2-title-ink: #f7fbff;
  --re0v2-title-stage: #070b0f;
  --re0v2-theme-stage: none;
  --re0v2-scene-art: none;
  --re0v2-check-art: none;
  --re0v2-restart-art: none;
  --re0v2-ability-art: none;
  --re0v2-theme-line: rgba(255, 255, 255, .2);
  --re0v2-local-panel: rgba(255, 255, 255, .72);
  position: relative;
  isolation: isolate;
  container-type: inline-size;
  width: min(980px, 100%);
  margin: 0 auto;
  color: var(--re0v2-ink);
  font-size: var(--re0v2-reading-size);
  line-height: 1.86;
  text-rendering: optimizeLegibility;
}

[data-re0v2-mount] *,
[data-re0v2-mount] *::before,
[data-re0v2-mount] *::after { box-sizing: border-box; }
[data-re0v2-mount] button,
[data-re0v2-mount] select,
[data-re0v2-mount] input { font: inherit; }
[data-re0v2-mount] button { cursor: pointer; }
[data-re0v2-mount] [hidden] { display: none !important; }
[data-re0v2-mount] :focus-visible { outline: 2px solid var(--re0v2-accent); outline-offset: 3px; }

[data-re0v2-mount][data-theme="day"] {
  --re0v2-ink: #122b3a;
  --re0v2-muted: #587081;
  --re0v2-surface: #f4fbff;
  --re0v2-surface-2: #e4f1f7;
  --re0v2-border: #91b9cf;
  --re0v2-accent: #277eae;
  --re0v2-accent-2: #d84f72;
  --re0v2-title-ink: #10293a;
  --re0v2-title-stage: #eaf6fb;
  --re0v2-theme-line: rgba(35, 121, 164, .28);
  --re0v2-local-panel: rgba(246, 252, 255, .86);
  --re0v2-card-shadow: 0 28px 90px rgba(33, 73, 94, .24), 0 0 0 7px rgba(255, 255, 255, .66);
}

[data-re0v2-mount][data-theme="night"] {
  --re0v2-ink: #f1e8df;
  --re0v2-muted: #baa8b5;
  --re0v2-surface: #15111b;
  --re0v2-surface-2: #211827;
  --re0v2-border: #4e3a53;
  --re0v2-accent: #d14b70;
  --re0v2-accent-2: #8a69d4;
  --re0v2-title-ink: #fff5ec;
  --re0v2-title-stage: #050408;
  --re0v2-theme-line: rgba(224, 77, 132, .34);
  --re0v2-local-panel: rgba(14, 9, 20, .78);
  --re0v2-card-shadow: 0 28px 90px rgba(0, 0, 0, .62);
}

[data-re0v2-mount][data-theme="tea"] {
  --re0v2-ink: #2b251c;
  --re0v2-muted: #71654f;
  --re0v2-surface: #efe3c8;
  --re0v2-surface-2: #ddcfad;
  --re0v2-border: #9d8963;
  --re0v2-accent: #536f45;
  --re0v2-accent-2: #9d3e55;
  --re0v2-title-ink: #2a241a;
  --re0v2-title-stage: #d8c79f;
  --re0v2-theme-line: rgba(68, 89, 52, .32);
  --re0v2-local-panel: rgba(245, 235, 209, .86);
  --re0v2-card-shadow: 0 26px 74px rgba(55, 40, 19, .32), 0 0 0 4px rgba(91, 73, 42, .13);
}

[data-re0v2-mount][data-font="serif"] { --re0v2-reading-font: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif; }
[data-re0v2-mount][data-font="sans"] { --re0v2-reading-font: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; }
[data-re0v2-mount][data-font="wenkai"] { --re0v2-reading-font: "LXGW WenKai", "STKaiti", KaiTi, serif; }
[data-re0v2-mount][data-font="xiaowei"] { --re0v2-reading-font: "ZCOOL XiaoWei", "FZShuTi", "STKaiti", serif; }
[data-re0v2-mount][data-size="small"] { --re0v2-reading-size: 15px; }
[data-re0v2-mount][data-size="medium"] { --re0v2-reading-size: 17px; }
[data-re0v2-mount][data-size="large"] { --re0v2-reading-size: 19px; }
[data-re0v2-mount][data-size="xlarge"] { --re0v2-reading-size: 22px; }

.re0v2-reader {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--re0v2-border);
  border-radius: 16px;
  background: var(--re0v2-surface);
  box-shadow: var(--re0v2-card-shadow);
}

[data-theme="day"] .re0v2-reader {
  border-width: 1px 1px 3px;
  border-radius: 26px 5px 26px 5px;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, .58), transparent 24% 78%, rgba(111, 190, 222, .12)),
    var(--re0v2-surface);
}

[data-theme="night"] .re0v2-reader {
  border-color: #55364f;
  border-radius: 3px;
  background: linear-gradient(145deg, #100b15, var(--re0v2-surface) 45%, #0b0910);
  box-shadow: var(--re0v2-card-shadow), inset 0 0 0 5px rgba(135, 61, 113, .06);
}

[data-theme="tea"] .re0v2-reader {
  border: 1px solid #8b744e;
  border-radius: 3px 30px 3px 30px;
  background:
    linear-gradient(92deg, rgba(255, 250, 232, .4), transparent 21% 78%, rgba(91, 103, 58, .1)),
    var(--re0v2-surface);
}

.re0v2-reader::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .48;
  background:
    radial-gradient(circle at 8% 12%, color-mix(in srgb, var(--re0v2-accent) 20%, transparent), transparent 25%),
    radial-gradient(circle at 92% 70%, color-mix(in srgb, var(--re0v2-accent-2) 14%, transparent), transparent 30%),
    repeating-linear-gradient(112deg, transparent 0 9px, color-mix(in srgb, var(--re0v2-border) 18%, transparent) 10px, transparent 11px 22px);
}

[data-theme="day"] .re0v2-reader::before {
  background:
    linear-gradient(115deg, transparent 0 49%, rgba(255, 255, 255, .72) 49.2% 49.6%, transparent 49.8%),
    radial-gradient(circle at 6% 18%, rgba(91, 178, 219, .22), transparent 24%),
    repeating-linear-gradient(90deg, transparent 0 31px, rgba(42, 122, 162, .035) 32px, transparent 33px 64px);
}

[data-theme="night"] .re0v2-reader::before {
  opacity: .72;
  background:
    radial-gradient(circle at 12% 18%, rgba(135, 55, 106, .24), transparent 28%),
    radial-gradient(circle at 86% 46%, rgba(84, 58, 135, .22), transparent 32%),
    repeating-linear-gradient(118deg, transparent 0 12px, rgba(255, 255, 255, .018) 13px, transparent 14px 28px),
    repeating-linear-gradient(0deg, transparent 0 5px, rgba(214, 74, 119, .022) 6px, transparent 7px 11px);
}

[data-theme="tea"] .re0v2-reader::before {
  opacity: .58;
  background:
    radial-gradient(ellipse at 12% 8%, rgba(96, 115, 67, .23), transparent 26%),
    radial-gradient(ellipse at 92% 88%, rgba(136, 53, 74, .13), transparent 24%),
    repeating-linear-gradient(4deg, transparent 0 3px, rgba(102, 82, 48, .055) 4px, transparent 5px 13px);
}

.re0v2-loading {
  margin: 0;
  padding: 64px 28px;
  border: 1px solid var(--re0v2-border);
  border-radius: 16px;
  color: var(--re0v2-muted);
  background: var(--re0v2-surface);
  text-align: center;
}

.re0v2-topbar {
  position: relative;
  z-index: 8;
  display: flex;
  min-height: 136px;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  padding: 10px clamp(16px, 4vw, 38px);
  border-bottom: 1px solid var(--re0v2-theme-line);
  background: color-mix(in srgb, var(--re0v2-surface) 92%, transparent);
  backdrop-filter: blur(14px);
}

[data-theme="day"] .re0v2-topbar {
  background:
    linear-gradient(112deg, rgba(255, 255, 255, .94) 0 43%, rgba(222, 243, 251, .84) 72%, rgba(255, 255, 255, .9)),
    repeating-linear-gradient(90deg, transparent 0 46px, rgba(35, 124, 170, .07) 47px, transparent 48px 92px);
  box-shadow: inset 0 -4px 0 rgba(87, 164, 199, .12);
}

[data-theme="night"] .re0v2-topbar {
  border-bottom-color: rgba(210, 64, 118, .38);
  background:
    linear-gradient(100deg, rgba(8, 5, 12, .98) 0 52%, rgba(33, 17, 41, .94)),
    repeating-linear-gradient(120deg, transparent 0 17px, rgba(198, 72, 125, .06) 18px, transparent 19px 36px);
  box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .04), 0 12px 28px rgba(0, 0, 0, .24);
}

[data-theme="tea"] .re0v2-topbar {
  border-bottom: 3px double rgba(83, 101, 59, .46);
  background:
    radial-gradient(circle at 9% 30%, rgba(255, 252, 235, .72), transparent 23%),
    repeating-linear-gradient(4deg, rgba(239, 227, 198, .94) 0 4px, rgba(223, 207, 169, .9) 5px, rgba(239, 227, 198, .94) 7px 14px);
  box-shadow: inset 0 -9px 16px rgba(82, 65, 38, .08);
}

.re0v2-identity { display: flex; min-width: 0; align-items: center; gap: 16px; }
.re0v2-logo { position: relative; display: grid; width: clamp(240px, 34vw, 340px); min-height: 118px; place-items: center start; }
.re0v2-logo img { position: relative; z-index: 1; display: block; width: 100%; max-height: 126px; object-fit: contain; object-position: left center; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, .18)); }
.re0v2-logo__fallback { position: absolute; color: var(--re0v2-accent); font: 900 38px/1 "Noto Serif SC", serif; letter-spacing: .03em; }
[data-theme="night"] .re0v2-logo img { filter: drop-shadow(0 0 18px rgba(207, 63, 120, .22)) drop-shadow(0 8px 18px rgba(0, 0, 0, .62)); }
[data-theme="tea"] .re0v2-logo img { filter: sepia(.18) drop-shadow(0 5px 10px rgba(63, 46, 21, .22)); }

.re0v2-reader-tools { position: relative; flex: 0 0 auto; }
.re0v2-settings-toggle {
  display: inline-flex;
  min-width: 112px;
  min-height: 44px;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid var(--re0v2-border);
  border-radius: 999px;
  padding: 8px 14px;
  color: var(--re0v2-ink);
  background: var(--re0v2-surface-2);
  font: 600 12px "Noto Sans SC", sans-serif;
  letter-spacing: .06em;
}
[data-theme="day"] .re0v2-settings-toggle { border-radius: 4px 18px 4px 18px; background: rgba(255, 255, 255, .78); box-shadow: inset 0 0 0 3px rgba(70, 148, 184, .08); }
[data-theme="night"] .re0v2-settings-toggle { border-radius: 3px; background: #1b1121; box-shadow: 6px 6px 0 rgba(121, 45, 91, .13); }
[data-theme="tea"] .re0v2-settings-toggle { border-radius: 999px; background: #e5d6b3; box-shadow: inset 0 0 0 3px rgba(255, 250, 229, .42); }
.re0v2-settings-toggle:hover,
.re0v2-settings-toggle[aria-expanded="true"] { border-color: var(--re0v2-accent); color: var(--re0v2-accent); }
.re0v2-settings-toggle__glyph { font-size: 18px; }
.re0v2-settings-panel {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  z-index: 12;
  display: grid;
  width: min(310px, calc(100cqw - 24px));
  gap: 14px;
  border: 1px solid var(--re0v2-border);
  border-radius: 14px 4px 14px 4px;
  padding: 16px;
  color: var(--re0v2-ink);
  background: color-mix(in srgb, var(--re0v2-surface) 96%, transparent);
  box-shadow: 0 22px 48px rgba(0, 0, 0, .28);
  backdrop-filter: blur(18px);
}
.re0v2-settings-panel h2 { margin: 0; color: var(--re0v2-accent); font: 700 15px "Noto Sans SC", sans-serif; letter-spacing: .12em; }
.re0v2-setting-group { display: grid; gap: 7px; margin: 0; border: 0; padding: 0; }
.re0v2-setting-group legend { margin-bottom: 5px; color: var(--re0v2-muted); font: 600 11px "Noto Sans SC", sans-serif; }
.re0v2-segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.re0v2-segmented button {
  min-width: 44px;
  min-height: 38px;
  border: 1px solid var(--re0v2-border);
  border-radius: 7px;
  color: var(--re0v2-muted);
  background: var(--re0v2-surface-2);
  font: 600 11px "Noto Sans SC", sans-serif;
}
.re0v2-segmented button[aria-pressed="true"] { border-color: var(--re0v2-accent); color: #fff; background: var(--re0v2-accent); }
.re0v2-setting-row { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; color: var(--re0v2-muted); font: 600 11px "Noto Sans SC", sans-serif; }
.re0v2-setting-row select { min-width: 0; min-height: 40px; border: 1px solid var(--re0v2-border); border-radius: 7px; padding: 6px 9px; color: var(--re0v2-ink); background: var(--re0v2-surface-2); }
.re0v2-static-toggle { display: flex; min-height: 42px; align-items: center; gap: 10px; border-top: 1px solid var(--re0v2-border); padding-top: 12px; color: var(--re0v2-ink); font: 600 12px "Noto Sans SC", sans-serif; }
.re0v2-static-toggle input { width: 20px; height: 20px; accent-color: var(--re0v2-accent); }

.re0v2-title-stage {
  position: relative;
  isolation: isolate;
  display: grid;
  min-height: clamp(220px, 31vw, 310px);
  overflow: hidden;
  align-content: center;
  gap: 15px;
  padding: clamp(30px, 5.5vw, 56px) clamp(22px, 7vw, 74px);
  color: var(--re0v2-title-ink);
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--re0v2-title-stage) 94%, transparent), color-mix(in srgb, var(--re0v2-title-stage) 76%, transparent) 58%, transparent),
    var(--re0v2-theme-stage) center right / cover no-repeat,
    var(--re0v2-title-stage);
}

[data-theme="day"] .re0v2-title-stage {
  border-bottom: 1px solid rgba(52, 133, 171, .38);
  background:
    linear-gradient(90deg, rgba(246, 252, 255, .97) 0 34%, rgba(238, 249, 253, .82) 58%, rgba(235, 248, 253, .2) 100%),
    var(--re0v2-theme-stage) center right / cover no-repeat,
    #eaf6fb;
}

[data-theme="night"] .re0v2-title-stage {
  border-block: 1px solid rgba(215, 65, 123, .28);
  background:
    linear-gradient(90deg, rgba(5, 3, 9, .94) 0 42%, rgba(7, 4, 12, .72) 66%, rgba(7, 4, 12, .12) 100%),
    var(--re0v2-theme-stage) center right / cover no-repeat,
    #050408;
}

[data-theme="tea"] .re0v2-title-stage {
  border-block: 5px double rgba(76, 91, 52, .42);
  background:
    linear-gradient(90deg, rgba(239, 226, 194, .96) 0 38%, rgba(237, 224, 191, .79) 62%, rgba(228, 211, 169, .12) 100%),
    var(--re0v2-theme-stage) center right / cover no-repeat,
    #ddcea9;
}

.re0v2-title-stage::before {
  content: "";
  position: absolute;
  inset: 14px;
  z-index: -1;
  border: 1px solid var(--re0v2-theme-line);
  background: linear-gradient(90deg, rgba(255, 255, 255, .025), transparent 38% 78%, rgba(255, 255, 255, .04));
  box-shadow: inset 0 0 72px rgba(0, 0, 0, .14);
}

[data-theme="day"] .re0v2-title-stage::before { border-radius: 18px 2px 18px 2px; box-shadow: inset 0 0 44px rgba(77, 161, 199, .08); }
[data-theme="night"] .re0v2-title-stage::before { inset: 9px; border-style: double; border-width: 3px; clip-path: polygon(0 0, 96% 0, 100% 14%, 100% 100%, 4% 100%, 0 86%); box-shadow: inset 0 0 84px rgba(0, 0, 0, .62); }
[data-theme="tea"] .re0v2-title-stage::before { inset: 12px 18px; border-radius: 0 28px 0 28px; border-color: rgba(65, 83, 46, .34); box-shadow: inset 0 0 44px rgba(96, 66, 31, .11); }

.re0v2-title-stage::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  opacity: .28;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255, 255, 255, .45) 0 1px, transparent 1.5px),
    radial-gradient(circle at 75% 68%, rgba(255, 255, 255, .25) 0 1px, transparent 1.4px);
  background-size: 119px 137px, 181px 163px;
  animation: re0v2-title-drift 26s linear infinite;
}
.re0v2-title {
  display: flex;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  flex-wrap: nowrap;
  align-items: baseline;
  gap: 0 .035em;
  margin: 0;
  color: var(--re0v2-title-ink);
  font-family: "Noto Serif SC", serif;
  font-size: clamp(8px, var(--re0v2-title-fit, 7.2cqw), 78px);
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -.07em;
  white-space: nowrap;
  text-shadow: 0 7px 22px rgba(0, 0, 0, .72);
}
[data-theme="day"] .re0v2-title { text-shadow: 0 2px 0 rgba(255, 255, 255, .94), 0 10px 26px rgba(38, 91, 116, .18); }
[data-theme="tea"] .re0v2-title { text-shadow: 0 1px 0 rgba(255, 250, 229, .86), 0 8px 20px rgba(61, 43, 18, .18); }
.re0v2-title-char { position: relative; display: inline-block; transform-origin: 50% 80%; animation: re0v2-title-rise 760ms cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--re0v2-char-index) * 36ms); }
.re0v2-title-char[data-accent="primary"] { color: var(--re0v2-accent); }
.re0v2-title-char[data-accent="secondary"] { color: var(--re0v2-accent-2); }
.re0v2-title-time { width: max-content; margin: 0; border-top: 1px solid var(--re0v2-theme-line); padding-top: 7px; color: color-mix(in srgb, var(--re0v2-title-ink) 72%, transparent); font: 600 10px/1.6 "Noto Sans SC", sans-serif; letter-spacing: .13em; }
.re0v2-title-mark { position: absolute; right: 26px; bottom: 19px; color: color-mix(in srgb, var(--re0v2-title-ink) 14%, transparent); font: 900 24px/1 "Noto Sans SC", sans-serif; letter-spacing: -.08em; }
.re0v2-title-stage[data-length="long"] .re0v2-title { line-height: 1.18; letter-spacing: -.085em; }
.re0v2-title-stage[data-length="medium"] .re0v2-title { letter-spacing: -.075em; }

.re0v2-title-stage[data-family="single-focus"] .re0v2-title { justify-content: center; text-align: center; }
.re0v2-title-stage[data-family="single-focus"] .re0v2-title-char[data-accent] { font-size: 1.32em; transform: translateY(.05em); }
.re0v2-title-stage[data-family="spotlight"] .re0v2-title { margin-left: auto; justify-content: flex-end; text-align: right; }
.re0v2-title-stage[data-family="spotlight"] .re0v2-title-char:nth-child(3n + 1) { font-size: 1.18em; }
.re0v2-title-stage[data-family="spotlight"]::before { clip-path: polygon(18% 0, 100% 0, 100% 100%, 0 100%); }
.re0v2-title-stage[data-family="rhythm"] .re0v2-title { align-items: center; justify-content: space-around; gap: .02em; }
.re0v2-title-stage[data-family="rhythm"] .re0v2-title-char:nth-child(3n + 1) { font-size: 1.34em; transform: translateY(-.08em); }
.re0v2-title-stage[data-family="rhythm"] .re0v2-title-char:nth-child(3n + 2) { font-size: .68em; transform: translateY(.18em); }
.re0v2-title-stage[data-family="duet"] .re0v2-title { width: 100%; align-items: baseline; justify-content: center; gap: .08em; }

[data-theme="day"] .re0v2-ability { border-radius: 24px 4px 24px 4px; background: linear-gradient(110deg, rgba(236, 248, 253, .92), rgba(255, 255, 255, .95) 54%, rgba(227, 241, 247, .88)); box-shadow: 0 18px 40px rgba(38, 88, 110, .13), inset 0 0 0 5px rgba(255, 255, 255, .5); }

.re0v2-check { position: relative; isolation: isolate; display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 18px; min-height: 156px; overflow: hidden; align-items: center; border: 1px solid var(--re0v2-border); padding: 22px 24px; background: linear-gradient(90deg, rgba(5, 9, 17, .08) 0 25%, var(--re0v2-local-panel) 48% 100%), var(--re0v2-check-art) left center / cover no-repeat, var(--re0v2-surface-2); box-shadow: 0 16px 34px rgba(0, 0, 0, .1); }

.re0v2-check__copy { min-width: 0; border: 1px solid color-mix(in srgb, var(--re0v2-border) 68%, transparent); padding: 14px 16px; background: color-mix(in srgb, var(--re0v2-local-panel) 78%, transparent); backdrop-filter: blur(7px); }

function graphemes(value) {
  const text = String(value ?? '').trim();
  if (typeof Intl !== 'undefined' && Intl.Segmenter) {
    return [...new Intl.Segmenter('zh-Hans', { granularity: 'grapheme' }).segment(text)]
      .map((item) => item.segment);
  }
  return Array.from(text);
}

function normalizeName(value) {
  return String(value ?? '').trim().replace(/[・•]/gu, '·');
}

function hash(value) {
  let result = 2166136261;
  for (const character of String(value ?? '')) {
    result ^= character.codePointAt(0);
    result = Math.imul(result, 16777619);
  }
  return result >>> 0;
}

function hslToHex(hue, saturation, lightness) {
  const s = saturation / 100;
  const l = lightness / 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((hue / 60) % 2 - 1));
  const m = l - c / 2;
  const rgb = hue < 60 ? [c, x, 0]
    : hue < 120 ? [x, c, 0]
      : hue < 180 ? [0, c, x]
        : hue < 240 ? [0, x, c]
          : hue < 300 ? [x, 0, c]
            : [c, 0, x];
  return `#${rgb.map((part) => Math.round((part + m) * 255).toString(16).padStart(2, '0')).join('')}`;
}

function genericCharacter(name) {
  const displayName = normalizeName(name) || '未知人物';
  const seed = hash(displayName);
  return {
    kind: 'generic',
    stableId: `generic-${seed.toString(16)}`,
    skinId: 'generic',
    rosterName: displayName,
    displayName,
    aliases: [displayName],
    portraitKey: 'generic',
    initial: graphemes(displayName)[0] ?? '?',
    primary: hslToHex(seed % 360, 52, 42),
    secondary: hslToHex((seed + 47) % 360, 44, 62),
    symbol: '◇',
    shape: 'generic',
    texture: 'paper',
    motion: 'sheen',
    avatar: { localUrl: '', primaryUrl: '', fallbackUrl: '' },
  };
}

function makeCharacter(entry, index) {
  const visual = VISUALS[entry.stableId];
  if (!visual) throw new Error(`Missing visual identity for ${entry.stableId}`);
  const [primary, secondary, symbol, shape, texture, motion] = visual;
  const encodedFile = encodeURIComponent(entry.referenceFile);
  return Object.freeze({
    ...entry,
    kind: 'character',
    skinId: entry.stableId,
    shortName: entry.rosterName,
    initial: graphemes(entry.rosterName)[0] ?? '?',
    primary,
    secondary,

    motion,

    }),

  });
}

function emphasisIndexes(name) {
  const characters = graphemes(name).filter((character) => !/[\s·・•]/u.test(character));
  if (!characters.length) return [];
  return characters.length <= 3 ? [0] : [0, 2];
}

function splitEmphasizedName(name) {
  const characters = graphemes(name);
  const visibleIndexes = emphasisIndexes(name);
  let visibleIndex = -1;
  return characters.map((character) => {
    if (!/[\s·・•]/u.test(character)) visibleIndex += 1;
    return { character, emphasized: visibleIndexes.includes(visibleIndex) };
  });
}

function resolveCharacter(name) {

  return ALIAS_INDEX.get(key) ?? genericCharacter(key);
}

  for (const part of splitEmphasizedName(displayName)) {
    const span = element(documentRef, 'span', part.emphasized ? 'is-emphasized' : '', part.character);
    name.append(span);
  }
  const symbol = element(documentRef, 'span', 're0v2-speaker-symbol', character.symbol);
  symbol.setAttribute('aria-hidden', 'true');
  name.append(symbol);
  return name;
}

function renderDialogue(documentRef, block, playerName) {
  const side = dialogueSide(block);
  const character = resolveCharacter(side === 'player' ? playerName : block.speaker);
  const article = element(documentRef, 'article', 're0v2-dialogue');
  article.dataset.side = side;
  article.dataset.skin = character.skinId;
  article.dataset.variant = String(character.variant ?? 0);
  article.dataset.shape = character.shape;
  article.dataset.texture = character.texture;
  article.dataset.motion = character.motion;
  article.style.setProperty('--re0v2-character-primary', character.primary);
  article.style.setProperty('--re0v2-character-secondary', character.secondary);
  article.style.setProperty('--re0v2-style-seed', String(character.styleSeed ?? 0));

  const body = element(documentRef, 'div', 're0v2-dialogue__body');
  body.append(renderSpeakerName(documentRef, character));
  const text = element(documentRef, 'p', 're0v2-dialogue__text');
  appendInline(documentRef, text, block.text);
  body.append(text);
  article.append(renderAvatar(documentRef, character), body);
  return article;
}

function renderNarration(documentRef, block) {
  return appendInline(documentRef, element(documentRef, 'p', 're0v2-narration'), block.text);
}

function renderScene(documentRef, block) {
  const scene = element(documentRef, 'section', 're0v2-scene');
  const compass = element(documentRef, 'span', 're0v2-scene__compass');
  compass.append(element(documentRef, 'span', '', '✦'));
  compass.setAttribute('aria-hidden', 'true');
  const copy = element(documentRef, 'div', 're0v2-scene__copy');
  copy.append(
    element(documentRef, 'p', 're0v2-scene__meta', [block.location, block.time, block.mood].filter(Boolean).join(' · ')),
    appendInline(documentRef, element(documentRef, 'p', ''), block.text),
  );
  scene.append(compass, copy);
  return scene;
}

function renderAbility(documentRef, block) {
  const kind = resolveAbilityKind(block.kind);
  const ability = element(documentRef, 'section', 're0v2-ability');
  ability.dataset.effect = kind.effect;
  ability.dataset.kind = kind.token;
  if (!kind.valid) ability.dataset.invalid = 'true';
  if (resolveAbilityVisual(kind.token)) {
    ability.style.setProperty('--re0v2-ability-art', abilityVisualCss(kind.token));
  }
  const sigil = element(documentRef, 'div', 're0v2-ability__sigil');
  sigil.setAttribute('aria-hidden', 'true');
  sigil.append(element(documentRef, 'span', '', kind.symbol));
  const body = element(documentRef, 'div', 're0v2-ability__body');
  const eyebrow = element(documentRef, 'p', 're0v2-ability__eyebrow', `${kind.label} · ${block.user || '未知使用者'}`);
  const heading = element(documentRef, 'h2', '', block.name || kind.kind);
  const affinities = block.affinities?.length
    ? element(documentRef, 'p', 're0v2-ability__affinity', `属性｜${block.affinities.join(' · ')}`)
    : null;
  const effect = appendInline(documentRef, element(documentRef, 'p', 're0v2-ability__effect'), block.effect || '能力效果未记录。');
  const details = element(documentRef, 'details', 're0v2-ability__description');
  details.open = true;
  details.append(
    element(documentRef, 'summary', '', '能力说明'),
    appendInline(documentRef, element(documentRef, 'p', ''), block.description || '暂无能力介绍。'),
  );
  body.append(eyebrow, heading);
  if (affinities) body.append(affinities);
  body.append(effect, details);
  ability.append(sigil, body);
  return ability;
}

function renderCheck(documentRef, block) {
  const check = element(documentRef, 'section', 're0v2-check');
  check.append(
    element(documentRef, 'span', 're0v2-check__die', 'D20'),
    element(documentRef, 'div', 're0v2-check__copy'),
  );
  check.lastElementChild.append(
    element(documentRef, 'p', 're0v2-check__meta', `检定｜${block.checkType} · ${block.actor} → ${block.target}`),
    element(documentRef, 'p', 're0v2-check__ledger', block.text),
  );
  return check;
}

function renderRestart(documentRef, block) {
  const restart = element(documentRef, 'section', 're0v2-restart');
  restart.append(
    element(documentRef, 'p', 're0v2-restart__label', `RETURN BY DEATH · ${block.deathId || 'UNKNOWN'}`),
    element(documentRef, 'h2', '', block.checkpoint || '未命名检查点'),
    appendInline(documentRef, element(documentRef, 'p', ''), block.text),
  );
  return restart;
}

function renderInvalid(documentRef, block) {
  const note = element(documentRef, 'aside', 're0v2-invalid');
  note.setAttribute('role', 'note');
  note.append(
    element(documentRef, 'strong', '', '未能识别的正文片段'),
    element(documentRef, 'p', '', block.text || block.raw || block.reason || '格式不完整'),
  );
  return note;
}

function renderBlock(documentRef, block, parsed) {
  if (block.type === 'narration') return renderNarration(documentRef, block);
  if (block.type === 'dialogue' || block.type === 'player-dialogue') return renderDialogue(documentRef, block, parsed.player);
  if (block.type === 'scene') return renderScene(documentRef, block);
  if (block.type === 'ability') return renderAbility(documentRef, block);
  if (block.type === 'check') return renderCheck(documentRef, block);
  if (block.type === 'restart') return renderRestart(documentRef, block);
  return renderInvalid(documentRef, block);
}

function parseSource(source) {
  const text = String(source ?? '');
  if (/<\/content\s*>/iu.test(text)) return parseNarrative(text);
  return parseStreamingNarrative(text);
}

function renderFallback(documentRef, parsed, source) {
  const fallback = element(documentRef, 'section', 're0v2-fallback');
  fallback.setAttribute('role', 'alert');
  fallback.append(
    element(documentRef, 'p', 're0v2-fallback__mark', 'ERR—00'),
    element(documentRef, 'h1', '', '正文协议尚未成形'),
    element(documentRef, 'p', '', parsed.errors?.[0]?.message || '请等待生成完成，或检查正文输出格式。'),
    element(documentRef, 'pre', '', String(source ?? '').slice(0, 4000)),
  );
  return fallback;
}

function requestFrameResize() {
  if (typeof window === 'undefined' || typeof document === 'undefined') return;
  const frame = window.frameElement;
  if (!frame?.style) return;
  const resize = () => {
    const height = Math.max(document.body?.scrollHeight || 0, document.documentElement?.scrollHeight || 0);
    if (height > 0) frame.style.height = `${height}px`;
  };
  resize();
  globalThis.requestAnimationFrame?.(resize);
}

function bindControls(mount) {
  if (mount.dataset.re0v2Bound === 'true') return;
  mount.dataset.re0v2Bound = 'true';
  mount.addEventListener('click', (event) => {
    const control = event.target?.closest?.('[data-action]');
    if (!control || !mount.contains(control)) return;
    const state = mount.__re0v2State;
    if (!state) return;
    const action = control.dataset.action;
    if (action === 'toggle-settings') state.settingsOpen = !state.settingsOpen;
    if (action === 'set-theme') state.settings.theme = control.dataset.value;
    if (action === 'set-size') state.settings.size = control.dataset.value;
    state.settings = writeReadingSettings(state.settings);
    renderNarrative(mount, state.source, { ...state.options, settings: state.settings, settingsOpen: state.settingsOpen });
  });
  mount.addEventListener('change', (event) => {
    const control = event.target;
    const state = mount.__re0v2State;
    if (!state || !control?.dataset?.setting) return;
    if (control.dataset.setting === 'font') state.settings.font = control.value;
    if (control.dataset.setting === 'staticMode') state.settings.staticMode = control.checked;
    state.settings = writeReadingSettings(state.settings);
    renderNarrative(mount, state.source, { ...state.options, settings: state.settings, settingsOpen: state.settingsOpen });
  });
}

function renderNarrative(target, source, options = {}) {
  const mount = target?.matches?.('[data-re0v2-mount]') ? target : target?.closest?.('[data-re0v2-mount]') || target;
  const app = mount?.querySelector?.('#re0v2-app') || (target?.id === 're0v2-app' ? target : null);
  if (!app?.ownerDocument) throw new TypeError('renderNarrative requires a RE0 narrative mount');
  const documentRef = app.ownerDocument;
  const parsed = typeof source === 'string' ? parseSource(source) : source;
  const settings = normalizeReadingSettings(options.settings || readReadingSettings());
  const theme = resolveTheme({ preference: settings.theme, period: parsed.time?.period });
  const font = fontById(settings.font);
  const size = sizeById(settings.size);
  mount.dataset.theme = theme.id;
  mount.dataset.font = font.id;
  mount.dataset.size = size.id;
  mount.dataset.static = String(settings.staticMode);
  mount.style.setProperty('--re0v2-reading-font', font.stack);
  mount.style.setProperty('--re0v2-reading-size', `${size.px}px`);
  applyThemeVisuals(mount, theme.id);
  app.setAttribute('aria-busy', 'false');

  const state = {
    source: source,
    options,
    settings,
    settingsOpen: options.settingsOpen === true,
  };
  mount.__re0v2State = state;
  bindControls(mount);

  const article = element(documentRef, 'article', 're0v2-reader');
  article.append(renderHeader(documentRef, state));
  if (parsed.ok || parsed.streaming) {
    article.append(renderTitle(documentRef, parsed));
    const flow = element(documentRef, 'section', 're0v2-story-flow');
    flow.setAttribute('aria-label', '剧情正文');
    for (const block of mergeAdjacentDialogue(parsed.blocks)) flow.append(renderBlock(documentRef, block, parsed));
    if (parsed.streaming && parsed.progressText) {
      const progress = element(documentRef, 'p', 're0v2-streaming', parsed.progressText);
      progress.setAttribute('aria-label', '正在生成');
      flow.append(progress);
    }
    article.append(flow);
  } else {
    article.append(renderFallback(documentRef, parsed, source));
  }
  app.replaceChildren(article);
  requestFrameResize();
  return { parsed, settings, theme };
}

globalThis.Re0NarrativeRenderer = Object.freeze({ renderNarrative });
globalThis.Re0NarrativeV2 = globalThis.Re0NarrativeRenderer;
})();
</script>
<script>
(function startRe0NarrativeReader() {
'use strict';
const core = globalThis.Re0NarrativeCore;
const renderer = globalThis.Re0NarrativeRenderer;
const roots = document.querySelectorAll('[data-re0v2-mount]');
if (roots.length !== 1) return;
const mount = roots[0];
if (mount.dataset.re0v2Initialized === 'true') return;
mount.dataset.re0v2Initialized = 'true';
const app = mount.querySelector('[data-re0v2-app]');
const carrier = mount.querySelector('[data-re0v2-source]');
const fail = (text) => {
  mount.dataset.re0v2Runtime = 'error';
  if (!app) return;
  const message = document.createElement('p');
  message.className = 're0v2-loading';
  message.textContent = text;
  app.replaceChildren(message);
  app.setAttribute('aria-busy', 'false');
};
const readPlayerName = () => {
  const hosts = [globalThis.SillyTavern];
  try {
    if (globalThis.parent !== globalThis) hosts.push(globalThis.parent?.SillyTavern);
  } catch (_error) {}
  for (const host of hosts) {
    try {
      const name = host?.getContext?.()?.name1;
      if (typeof name === 'string' && name.trim()) return name.trim();
    } catch (_error) {}
  }
  return '';
};
if (!core || !renderer || !carrier) {
  fail('正文启动失败：运行组件不完整。');
  return;
}
try {
  const source = String(carrier.value || carrier.textContent || '');
  const parsed = core.parsePackedContentEnvelope(source);
  if (!parsed.player) parsed.player = readPlayerName();
  carrier.remove();
  renderer.renderNarrative(mount, parsed);
  mount.dataset.re0v2Runtime = 'ready';
} catch (_error) {
  fail('正文启动失败：请检查输出格式。');
}
})();
</script>
